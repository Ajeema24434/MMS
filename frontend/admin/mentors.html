<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty Mentors — Admin Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-900 flex flex-col font-sans">

    <header class="bg-slate-900 text-white shadow-md border-b border-slate-800 sticky top-0 z-30">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <span class="font-bold text-base tracking-tight">Mentor-Mentee System</span>
                <span class="bg-indigo-500/20 text-indigo-300 text-[10px] px-2.5 py-0.5 rounded-full border border-indigo-500/30 font-semibold uppercase">ADMIN</span>
            </div>
            
            <nav class="hidden md:flex items-center space-x-6 text-sm font-medium">
                <a href="/admin/dashboard.html" class="text-slate-300 hover:text-white py-5">Dashboard</a>
                <a href="/admin/mentors.html" class="text-indigo-400 font-semibold border-b-2 border-indigo-500 py-5">Mentors</a>
                <a href="/admin/students.html" class="text-slate-300 hover:text-white py-5">Students</a>
                <a href="/admin/batches.html" class="text-slate-300 hover:text-white py-5">Batches</a>
            </nav>

            <div class="flex items-center space-x-4">
                <button id="logout-btn" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-semibold rounded-lg border border-slate-700 transition">
                    Logout
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-6">
        
        <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Faculty Mentors</h1>
                <p class="text-xs text-slate-500">Register new faculty advisors and view assigned academic batches.</p>
            </div>
            <button onclick="openModal()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold rounded-lg shadow transition flex items-center space-x-1">
                <span>+ Register New Mentor</span>
            </button>
        </div>

        <!-- Mentors Table Card -->
        <div class="shadcn-card overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between gap-4">
                <h3 class="font-bold text-slate-900 text-base">Faculty Directory</h3>
                <div class="w-full sm:w-64">
                    <input type="text" id="mentor-search" placeholder="Search mentor name, code, dept..." 
                           class="w-full px-3 py-1.5 bg-slate-50 border border-slate-200 rounded-lg text-xs outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 text-slate-500 uppercase text-[11px] font-semibold border-b border-slate-200">
                            <th class="px-6 py-3">Faculty Name</th>
                            <th class="px-6 py-3">Mentor Code</th>
                            <th class="px-6 py-3">Department</th>
                            <th class="px-6 py-3">Designation</th>
                            <th class="px-6 py-3">Email</th>
                            <th class="px-6 py-3">Assigned Batch</th>
                        </tr>
                    </thead>
                    <tbody id="mentors-tbody">
                        <tr><td colspan="6" class="px-6 py-8 text-center text-slate-400 text-sm">Loading mentors directory...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Create Mentor Modal -->
    <div id="mentor-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl border border-slate-200 animate-fade-in">
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                <h3 class="font-bold text-slate-900 text-lg">Register Faculty Mentor</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg">✕</button>
            </div>

            <form id="create-mentor-form" class="space-y-3">
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Full Name</label>
                    <input type="text" id="m-name" required placeholder="e.g. Dr. Rajesh Sharma" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Mentor Code / ID</label>
                    <input type="text" id="m-code" required placeholder="e.g. MNT105" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email Address</label>
                    <input type="email" id="m-email" required placeholder="e.g. rajesh@mms.edu" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Department</label>
                    <input type="text" id="m-dept" required placeholder="e.g. Computer Engineering" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Designation</label>
                    <input type="text" id="m-desig" placeholder="e.g. Assistant Professor" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Password</label>
                    <input type="password" id="m-pass" placeholder="Default: password123" class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500">
                </div>

                <div class="pt-2 flex space-x-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 py-2 bg-slate-100 text-slate-700 font-semibold text-sm rounded-lg hover:bg-slate-200">Cancel</button>
                    <button type="submit" class="w-1/2 py-2 bg-indigo-600 text-white font-semibold text-sm rounded-lg hover:bg-indigo-500">Save Mentor</button>
                </div>
            </form>
        </div>
    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/admin.js"></script>
    <script>
        function openModal() { document.getElementById('mentor-modal').classList.remove('hidden'); }
        function closeModal() { document.getElementById('mentor-modal').classList.add('hidden'); }

        document.getElementById('create-mentor-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const body = {
                name: document.getElementById('m-name').value.trim(),
                mentor_code: document.getElementById('m-code').value.trim(),
                email: document.getElementById('m-email').value.trim(),
                department: document.getElementById('m-dept').value.trim(),
                designation: document.getElementById('m-desig').value.trim() || 'Assistant Professor',
                password: document.getElementById('m-pass').value || 'password123'
            };
            const res = await API.post('/admin/mentors', body);
            if (res.success) {
                closeModal();
                loadAdminMentors();
            } else {
                alert(res.message || 'Error creating mentor');
            }
        });
    </script>
</body>
</html>
